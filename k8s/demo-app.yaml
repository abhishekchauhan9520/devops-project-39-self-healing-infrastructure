apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-demo
  namespace: self-healing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: self-healing-demo
  template:
    metadata:
      labels:
        app: self-healing-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 8080
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -i 's/listen       80;/listen       8080;/' /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing-demo
  namespace: self-healing
spec:
  selector:
    app: self-healing-demo
  ports:
    - port: 80
      targetPort: 8080
